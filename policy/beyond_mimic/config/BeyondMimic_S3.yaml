# ----------------------------------------------------------------
# !! 核心 !!: S3 MuJoCo -> Lab 关节索引映射
# !!!!!!!mj2lab就是把mujoco里的关节顺序（位置）按照lab的顺序填好（序号）!!!!!!!!!
